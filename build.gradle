plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}
def buildtime = System.currentTimeSeconds()

version = project.mod_version
group = project.maven_group

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

apply plugin: "fabric-loom"

loom {
    accessWidenerPath = file("src/main/resources/nvidium.accesswidener")

    runs {
        it.configureEach {
            vmArgs("-Xmx16G")
        }
    }
}

base {
    archivesName = "nvidium"
}

tasks.named('jar') {
    from('LICENSE.txt') { into 'META-INF'; rename { 'LICENSE-nvidium.txt' } }
}

processResources {
    def version = project.version

    inputs.properties("version": version, "commit": gitCommitHash, "buildtime": buildtime)

    filesMatching("fabric.mod.json") {
        expand "commit": gitCommitHash, "version": version, "buildtime": buildtime
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases" // or /snapshots
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation(fabricApi.module("fabric-api-base", project.fabric_version))
    implementation(fabricApi.module("fabric-block-getter-api-v2", project.fabric_version))
    implementation(fabricApi.module("fabric-rendering-fluids-v1", project.fabric_version))
    //modImplementation(fabricApi.module("fabric-renderer-api-v1", project.fabric_version))

    implementation(fabricApi.module("fabric-resource-loader-v0", project.fabric_version))

    implementation "net.caffeinemc:sodium-fabric:0.9.2+mc26.3"
    implementation "net.caffeinemc:sodium-fabric-api:0.9.2+mc26.3"

    //modImplementation "maven.modrinth:c2me-fabric:0.2.0+alpha.10.49+1.19.4"
    //modImplementation "maven.modrinth:chunks-fade-in:v1.0.3-1.19.4"
    //modImplementation "maven.modrinth:immersiveportals:v2.7.3-mc1.19.4"
    compileOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
    runtimeOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
    compileOnly "io.github.douira:glsl-transformer:3.0.0-pre3"
    compileOnly "org.antlr:antlr4-runtime:4.13.1"

    testImplementation "io.github.douira:glsl-transformer:3.0.0-pre3"
    testImplementation "org.antlr:antlr4-runtime:4.13.1"
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.lwjgl:lwjgl-glfw:3.4.3"
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def natives = os.contains('win') ? 'natives-windows' : os.contains('mac') ? 'natives-macos' : 'natives-linux'
    if (arch == 'aarch64' || arch == 'arm64') natives += '-arm64'
    testRuntimeOnly "org.lwjgl:lwjgl-glfw:3.4.3:${natives}"
    testImplementation "maven.modrinth:iris:1.11.7+26.3-fabric"
    testImplementation "org.anarres:jcpp:1.4.14"
    if (providers.gradleProperty('euphoriaTests').isPresent()) {
        runtimeOnly files('../reference-packs/patcher/EuphoriaPatcher-1.10.5-r5.9.3-fabric.jar')
    }
}

test {
    useJUnitPlatform()
    systemProperty 'nvidium.gpuTests', System.getProperty('nvidium.gpuTests', 'false')
    systemProperty 'nvidium.referencePacks', System.getProperty('nvidium.referencePacks', file('../reference-packs').absolutePath)
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Separate development mod: verifies real Fabric/Mixin transformation, then exits.
// It is never included in the user-facing Nvidium JAR.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
    }
}

dependencies {
    smokeCompileOnly(fabricApi.module('fabric-lifecycle-events-v1', project.fabric_version))
}

tasks.register('smokeJar', Jar) {
    dependsOn tasks.named('smokeClasses')
    from sourceSets.smoke.output
    archiveFileName = 'nvidium-iris-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
}

loom {
    runs {
        irisSmoke {
            client()
            name = 'Nvidium Iris integration smoke test'
            runDir = 'run-smoke'
            vmArgs '-Dfabric.addMods=' + file('build/smoke/nvidium-iris-smoke.jar').absolutePath,
                    '-Dnvidium.iris.experimental=true', '--enable-native-access=ALL-UNNAMED'
        }
        irisRender {
            client()
            name = 'Nvidium Iris isolated render test'
            runDir = 'run-render'
            vmArgs '-Dfabric.addMods=' + file('build/smoke/nvidium-iris-smoke.jar').absolutePath,
                    '-Dnvidium.iris.experimental=true', '-Dnvidium.smoke.mode=world', '--enable-native-access=ALL-UNNAMED'
            if (providers.gradleProperty('euphoriaTests').isPresent()) vmArgs '-Dnvidium.smoke.euphoria=true'
        }
    }
}

tasks.named('runIrisSmoke') {
    dependsOn tasks.named('smokeJar')
}

tasks.register('prepareIrisRender') {
    doLast {
        copy {
            from file('../reference-packs')
            include 'ComplementaryReimagined_r5.9.3.zip', 'ComplementaryUnbound_r5.9.3.zip'
            if (providers.gradleProperty('euphoriaTests').isPresent()) {
                include 'ComplementaryReimagined_r5.9.3 + EuphoriaPatches_1.10.5/**', 'ComplementaryUnbound_r5.9.3 + EuphoriaPatches_1.10.5/**'
            }
            into file('run-render/shaderpacks')
        }
        file('run-render/config').mkdirs()
        def pack = providers.gradleProperty('euphoriaTests').isPresent() ? 'ComplementaryReimagined_r5.9.3 + EuphoriaPatches_1.10.5' : 'ComplementaryReimagined_r5.9.3.zip'
        file('run-render/config/iris.properties').text = """enableShaders=true
shaderPack=${pack}
disableUpdateMessage=true
enableDebugOptions=false
"""
        if (!file('run-render/options.txt').exists()) file('run-render/options.txt').text = '''renderDistance:6
simulationDistance:5
maxFps:60
enableVsync:false
pauseOnLostFocus:false
onboardAccessibility:false
graphicsBackend:opengl
'''
    }
}
tasks.named('runIrisRender') {
    dependsOn tasks.named('smokeJar'), tasks.named('prepareIrisRender')
}

